[General]
network = MetsrVeinsBridgeNetwork
sim-time-limit = 7d
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 30s

*.bridge.bridgeHost = "0.0.0.0"
*.bridge.bridgePort = 9099
*.bridge.baseLatencyMs = 8
*.bridge.perMessageLatencyMs = 0.35
*.bridge.perPayloadByteLatencyUs = 0.04
*.bridge.contentionLossSlope = 0.0002
*.bridge.bitrateMbps = 6
*.bridge.macSlotTimeMs = 0.013
*.bridge.maxJitterMs = 0.25
*.bridge.communicationRangeM = 1000
*.bridge.distanceLatencyUsPerM = 2
*.bridge.distanceLossAtRange = 0.05
*.bridge.pollIntervalMs = 10
*.bridge.bridgeBackend = "abstract_omnetpp"
*.bridge.backendImplementation = "abstract_event_profile"
*.bridge.networkModel = "omnetpp_event_wireless_queue_model"
*.bridge.backendNote = "Default lightweight OMNeT++ event-scheduled queue/contention model."
*.bridge.radioAccess = "cv2x"
*.bridge.logRequests = true

[Config AbstractOmnetpp]
description = "Default abstract OMNeT++ event-scheduled queue/contention model."
*.bridge.bridgeBackend = "abstract_omnetpp"
*.bridge.backendImplementation = "abstract_event_profile"
*.bridge.networkModel = "omnetpp_event_wireless_queue_model"
*.bridge.backendNote = "Default lightweight OMNeT++ event-scheduled queue/contention model."
*.bridge.radioAccess = "cv2x"

[Config Veins80211p]
description = "Real Veins 5.3.1 IEEE 802.11p/1609.4 PHY/MAC backend."
network = MetsrVeins80211pNetwork
*.bridge.bridgeBackend = "veins_80211p"
*.bridge.backendImplementation = "veins_80211p_phy_mac"
*.bridge.networkModel = "veins_5_3_1_nic80211p"
*.bridge.backendNote = "METS-R mobility drives dynamic Veins vehicles; delivery is reported only by real Mac1609_4/PhyLayer80211p receive events."
*.bridge.radioAccess = "802.11p"
*.bridge.veinsReceiveTimeoutMs = 1000
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
**.nic.mac1609_4.useServiceChannel = false
**.nic.mac1609_4.txPower = 20mW
**.nic.mac1609_4.bitrate = 6Mbps
**.nic.mac1609_4.useAcks = false
**.nic.phy80211p.minPowerLevel = -110dBm
**.nic.phy80211p.useNoiseFloor = true
**.nic.phy80211p.noiseFloor = -98dBm
**.nic.phy80211p.decider = xmldoc("veins/phy80211p.xml")
**.nic.phy80211p.analogueModels = xmldoc("veins/phy80211p.xml")
**.nic.phy80211p.usePropagationDelay = true
**.nic.phy80211p.collectCollisionStatistics = true
**.appl.headerLength = 88bit
**.appl.beaconLengthBits = 0bit
**.appl.bridgeInjectionSpread = 20ms
**.appl.sendBeacons = false
**.appl.dataOnSch = false

[Config Sim5gCellularUu]
description = "True Simu5G cellular Uu backend. Requires build_sim5g.sh and the generated Simu5G NED path."
network = Sim5gCellularUuBridgeNetwork
*.bridge.bridgeBackend = "sim5g_cellular_uu"
*.bridge.backendImplementation = "simu5g_cellular_uu"
*.bridge.networkModel = "simu5g_nr_uu"
*.bridge.backendNote = "True Simu5G Uu backend: METS-R BSM payloads are injected into Simu5G UE applications and delivered through NR Uu."
*.bridge.radioAccess = "5g_nr_uu"
*.bridge.simu5gVehicleModuleName = "car"
*.bridge.simu5gMobilityModuleName = "mobility"
*.bridge.simu5gBsmAppIndex = 0
*.bridge.simu5gLocalPort = 4400
*.bridge.simu5gDestPort = 4400
*.bridge.simu5gReceiveTimeoutMs = 1000
